[package]
name = "wyvpn-app"
version.workspace = true
description = "WyVPN desktop app"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Distinct lib name avoids bin/lib output clash on Windows (cargo#8519).
name = "wyvpn_app_lib"

[[bin]]
name = "WyVPN"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
getrandom = "0.3"
semver = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
wyvpn-ipc.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-service-management = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSGraphics"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7"
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"
