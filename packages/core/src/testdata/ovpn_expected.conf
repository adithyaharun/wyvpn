setenv UV_ID abcdef0123456789abcdef0123456789
setenv UV_NAME laptop
{VERSION_LINE}
client
dev tun
dev-type tun
connect-retry-max 1
remap-usr1 SIGTERM
remote vpn.example.com 1194 udp
nobind
persist-tun
auth SHA256
verb 3
mute 20
push-peer-info
ping 10
ping-exit 60
hand-window 90
server-poll-timeout 10
reneg-sec 0
redirect-gateway def1
sndbuf 0
rcvbuf 0
mssfix 1300
fragment 1200
tun-mtu 1400
remote-cert-tls server
compress lz4
comp-lzo no
auth-user-pass
key-direction 1
pull-filter ignore "ping-restart"
pull-filter ignore "dhcp-option DOMAIN-ROUTE"
ignore-unknown-option disable-dco
disable-dco
data-ciphers "AES-256-GCM:AES-128-CBC:AES-128-GCM:CHACHA20-POLY1305"
