00112233445566778899aabbccddeeff
-----END OpenVPN Static key V1-----
</tls-auth>
<cert>
-----BEGIN CERTIFICATE-----
Q0VSVC1GQUtF
-----END CERTIFICATE-----
</cert>
<key>
