# synthetic profile
ignore-unknown-option data-ciphers
setenv UV_ID abcdef0123456789abcdef0123456789
setenv UV_NAME laptop
setenv UV_OTHER ignored
setenv-safe FOO bar
client
dev tun
dev-type tun
proto udp
remote vpn.example.com 1194
nobind
persist-tun
cipher AES-256-CBC
auth SHA256
verb 3
mute 20
push-peer-info
ping 10
ping-restart 60
hand-window 90
server-poll-timeout 10
reneg-sec 0
redirect-gateway def1 bogus-flag
sndbuf 0
rcvbuf 0
mssfix 1300
fragment 1200
tun-mtu 1400
remote-cert-tls server
compress lz4
comp-lzo no
auth-user-pass
key-direction 1
data-ciphers AES-256-GCM:AES-256-GCM:AES-128-CBC:BF-CBC
up /bin/evil.sh
down /bin/evil.sh
script-security 3
route 10.0.0.0 255.0.0.0
dhcp-option DNS 1.1.1.1
plugin /lib/evil.so
management 127.0.0.1 7505
log /tmp/log
cd /
config /etc/other.conf
tls-verify /bin/evil.sh
unknown-thing 1
<ca>
